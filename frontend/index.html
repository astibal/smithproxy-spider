<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Smithproxy Spider</title><link rel="stylesheet" href="style.css"></head>
<body><header><h1>Smithproxy Spider</h1><label>Backend <input id="backend" value="http://127.0.0.1:8080"></label><label class="token-label">Token <span class="token-field"><input id="token" type="password" name="spider-api-token" autocomplete="new-password" spellcheck="false" placeholder="paste actual token" data-protonpass-ignore="true" data-1p-ignore data-lpignore="true"><button id="toggle-token" type="button" class="field-button" title="Show token" aria-label="Show token">👁</button><button id="clear-token" type="button" class="field-button" title="Clear token" aria-label="Clear token">×</button></span></label>
<button id="connect">Connect</button><span id="status">idle</span></header>
<main><div id="sidebar" class="sidebar"><section><h2>Smithproxy connection</h2>
<label>API URL <input id="smithproxy-url" value="https://127.0.0.1:55555"></label>
<label>API key <input id="smithproxy-key" type="password" autocomplete="off"></label>
<label class="check"><input id="smithproxy-verify" type="checkbox" checked> Verify TLS certificate</label>
<button id="configure">Connect Smithproxy</button><span id="configure-status"></span>
</section><section><h2>Chain</h2><pre id="chain">waiting for Spider</pre></section>
<section><h2>Active sessions</h2><div id="sessions" class="empty">none</div></section></div>
<section class="workspace"><div class="tabs"><button type="button" data-tab="events-tab" aria-selected="true">Events</button><button type="button" data-tab="history-tab" aria-selected="false">Session history</button><button type="button" data-tab="workbench-tab" aria-selected="false">Payload workbench</button></div>
<div id="events-tab" class="tab-panel"><div class="section-head"><h2>Events</h2><div id="event-filters" class="filters"><button type="button" data-filter="ping" aria-pressed="false">ping</button><button type="button" data-filter="sessions" aria-pressed="true">sessions</button><button type="button" data-filter="status" aria-pressed="true">status</button><button type="button" data-filter="other" aria-pressed="true">other</button><button id="clear-events" type="button" class="clear-filter" title="Clear displayed events">Clear</button></div></div><pre id="events"></pre></div>
<div id="history-tab" class="tab-panel" hidden><div class="section-head"><h2>Sessions <span id="history-count"></span></h2><button id="clear-history" type="button" class="danger-subtle" title="Remove completed sessions">Clear completed</button></div><div class="history-layout"><div id="history-list" class="history-list empty">none</div><div class="history-detail"><div class="section-head"><h2 id="detail-title">Session detail</h2><button id="reload-detail" type="button" class="reload" title="Reload session detail" disabled>↻</button></div><div id="session-detail" class="empty">select a session</div></div></div></div>
<div id="workbench-tab" class="tab-panel" hidden><div class="section-head"><h2>Payload workbench</h2><span id="workbench-source" class="empty">waiting for connection-content</span><div class="font-controls"><button id="font-smaller" type="button" class="secondary" title="Smaller editor font">A−</button><button id="font-larger" type="button" class="secondary" title="Larger editor font">A+</button></div></div>
<div id="workbench-layout" class="workbench-layout"><div class="workbench-input"><div class="section-head"><h3>Payload</h3><div id="payload-modes" class="filters"><button type="button" data-mode="ascii" aria-pressed="true">ASCII</button><button type="button" data-mode="hex" aria-pressed="false">HEX</button></div></div><div class="workbench-tools"><select id="payload-select"><option value="">follow latest payload</option></select><button id="load-payload" type="button" class="secondary">Load</button><button id="sample-payload" type="button" class="secondary">Sample</button></div><textarea id="payload-text" class="code-view" spellcheck="false" placeholder="UTF-8/text view of payload"></textarea><pre id="payload-hex" class="code-view" hidden></pre></div>
<div id="workbench-divider" class="workbench-divider" role="separator" aria-orientation="vertical" aria-label="Resize payload and script panels" tabindex="0"></div>
<div class="workbench-script"><div class="section-head"><h3>Script</h3><div id="script-slots" class="filters"><button type="button" data-slot="1" aria-pressed="true">1</button><button type="button" data-slot="2" aria-pressed="false">2</button><button type="button" data-slot="3" aria-pressed="false">3</button><button type="button" data-slot="4" aria-pressed="false">4</button></div></div><textarea id="script-editor" class="code-view" spellcheck="false"></textarea><div class="workbench-tools"><button id="run-script" type="button">Run</button><button id="reset-script" type="button" class="secondary">Reset slot</button><span id="script-status" class="empty">idle</span></div></div>
<div class="workbench-output"><h3>Result</h3><textarea id="replacement-text" spellcheck="false" readonly placeholder="unchanged"></textarea><details open><summary>Script output</summary><pre id="script-output"></pre></details></div></div></div></section></main>
<script src="app.js"></script></body></html>
